[package]
name = "ruffle-ps3-player"
version = "0.4.0"
edition = "2024"
[lib]
crate-type = ["staticlib", "rlib"]
[workspace]
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
opt-level = 2
codegen-units = 16

[dependencies]
ruffle_core = { path = "../deps/ruffle/core", features = ["lzma", "audio", "mp3", "default_font"] }
getrandom = "0.4"
ruffle_render = { path = "../deps/ruffle/render" }
swf = { path = "../deps/ruffle/swf" }
tiny-skia = { path = "../vendor/tiny-skia", default-features = false, features = ["std"] }

[features]
path-snapshots = ["ruffle_core/puffle-path-snapshots"]
profile-vm = ["ruffle_core/puffle-profile"]
host-rsx-unbatched = ["host-rsx-probe"]
host-rsx-probe = ["ruffle_render/tessellator"]
ps3-simd = ["tiny-skia/ps3-simd"]
ps3-rsx = ["ruffle_render/tessellator"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("ps3"))'] }

[build-dependencies]
cc = "1"

[patch.crates-io]
jpeg-decoder = { path = "../vendor/jpeg-decoder" }
